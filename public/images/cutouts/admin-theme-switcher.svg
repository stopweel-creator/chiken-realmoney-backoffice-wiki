<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" fill="none">
  <rect width="920" height="240" rx="24" fill="#0E1420"/>
  <rect x="28" y="28" width="864" height="184" rx="20" fill="#111A28" stroke="#253247"/>
  <text x="52" y="68" fill="#DCE8FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Theme Selector</text>
  <rect x="52" y="92" width="250" height="92" rx="18" fill="#151F2E" stroke="#314761"/>
  <text x="72" y="122" fill="#A8BAD7" font-family="Segoe UI, Arial, sans-serif" font-size="14">aurora</text>
  <rect x="72" y="136" width="210" height="26" rx="13" fill="url(#auroraGrad)"/>
