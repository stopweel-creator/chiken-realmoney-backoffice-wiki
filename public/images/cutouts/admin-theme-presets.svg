<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" fill="none">
  <rect width="1180" height="360" rx="28" fill="#0C111A"/>
  <text x="42" y="54" fill="#EAF1FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Theme Presets</text>
  <rect x="36" y="82" width="340" height="238" rx="22" fill="#101926" stroke="#27374E"/>
  <text x="60" y="118" fill="#D8F2FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Aurora</text>
  <rect x="60" y="138" width="292" height="68" rx="18" fill="url(#auroraBg)"/>
  <rect x="60" y="222" width="126" height="34" rx="17" fill="rgba(39,224,138,0.22)" stroke="rgba(39,224,138,0.34)"/>
  <text x="84" y="244" fill="#E7FFF2" font-family="Segoe UI, Arial, sans-serif" font-size="14">Success pulse</text>
  <rect x="208" y="222" width="126" height="34" rx="17" fill="rgba(255,89,109,0.18)" stroke="rgba(255,89,109,0.3)"/>
  <text x="236" y="244" fill="#FFE8EC" font-family="Segoe UI, Arial, sans-serif" font-size="14">Error pulse</text>
  <text x="60" y="286" fill="#D6E4FB" font-family="Segoe UI, Arial, sans-serif" font-size="14">Balanced animated gradient for the main operational view.</text>

  <rect x="420" y="82" width="340" height="238" rx="22" fill="#12161D" stroke="#333C49"/>
  <text x="444" y="118" fill="#EEF2F8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Dark</text>
  <rect x="444" y="138" width="292" height="68" rx="18" fill="url(#darkBg)"/>
  <rect x="444" y="222" width="126" height="34" rx="17" fill="rgba(121,187,255,0.18)" stroke="rgba(121,187,255,0.28)"/>
  <text x="468" y="244" fill="#EBF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="14">Toast accent</text>
  <rect x="592" y="222" width="126" height="34" rx="17" fill="rgba(55,223,138,0.16)" stroke="rgba(55,223,138,0.28)"/>
  <text x="620" y="244" fill="#ECFFF5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Low-noise state</text>
  <text x="444" y="286" fill="#DBE2EE" font-family="Segoe UI, Arial, sans-serif" font-size="14">Neutral dark preset for long finance and audit sessions.</text>

  <rect x="804" y="82" width="340" height="238" rx="22" fill="#0A1624" stroke="#32557C"/>
  <text x="828" y="118" fill="#D5ECFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Midnight</text>
  <rect x="828" y="138" width="292" height="68" rx="18" fill="url(#midnightBg)"/>
  <rect x="828" y="222" width="126" height="34" rx="17" fill="rgba(105,209,255,0.18)" stroke="rgba(105,209,255,0.34)"/>
  <text x="854" y="244" fill="#E4F5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14">Status glow</text>
  <rect x="976" y="222" width="126" height="34" rx="17" fill="rgba(255,89,109,0.18)" stroke="rgba(255,89,109,0.28)"/>
  <text x="1005" y="244" fill="#FFE9ED" font-family="Segoe UI, Arial, sans-serif" font-size="14">Alert glow</text>
  <text x="828" y="286" fill="#D2E6FF" font-family="Segoe UI, Arial, sans-serif" font-size="14">Blue night preset with stronger operational emphasis.</text>

  <defs>
    <linearGradient id="auroraBg" x1="60" y1="172" x2="352" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27E08A"/>
      <stop offset="0.5" stop-color="#5EC7FF"/>
      <stop offset="1" stop-color="#FF596D"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="444" y1="172" x2="736" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6679"/>
      <stop offset="0.52" stop-color="#79BBFF"/>
      <stop offset="1" stop-color="#37DF8A"/>
    </linearGradient>
    <linearGradient id="midnightBg" x1="828" y1="172" x2="1120" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69D1FF"/>
      <stop offset="0.48" stop-color="#357DFF"/>
      <stop offset="1" stop-color="#27E08A"/>
    </linearGradient>
  </defs>
